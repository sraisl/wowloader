name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Python-Syntax
        run: python -m py_compile wow_downloader.py app.py

      - name: JavaScript-Syntax
        run: |
          python -c "import re; print('\n'.join(re.findall(r'<script>(.*?)</script>', open('static/index.html').read(), re.S)))" \
            | node --check --input-type=commonjs

      - name: Import-Test
        run: |
          DEST="$RUNNER_TEMP/data" python -c "import app; print(sorted(r.path for r in app.app.routes))"
          python wow_downloader.py --help

  sast:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF-Upload nach Code Scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Explizite Engines statt "all": ESLint bricht ab, wenn es keine .js-Dateien gibt
      # (das UI-JavaScript steht inline in static/index.html).
      - name: PolyScan
        uses: sraisl/polyscan-action@c801894f046bf0a567e64cac309d95656713ad8f # v16.1.1
        with:
          engines: semgrep,bandit,trivy,gitleaks,betterleaks,hadolint,zizmor
          max-critical: "0"
          max-high: "0"
          max-medium: "50"
          sarif: "true"
          sbom: "true"
          upload-artifacts: "true"

      - name: SARIF nach Code Scanning
        if: always() && hashFiles('polyscan.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: polyscan.sarif
          category: polyscan

  docker:
    name: Docker-Image
    needs: [check, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write # SARIF-Upload des Image-Scans
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Erst ein amd64-Image in den lokalen Daemon laden und scannen; gepusht wird nur,
      # wenn der Image-Scan die Quality Gate besteht. Der Cache macht den zweiten Build schnell.
      - name: Image für den Scan bauen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: wowloader:scan
          cache-from: type=gha

      - name: Image-Scan (Trivy)
        uses: sraisl/polyscan-action@c801894f046bf0a567e64cac309d95656713ad8f # v16.1.1
        with:
          engines: trivy
          trivy-image: wowloader:scan
          max-critical: "0"
          max-high: "0"
          max-medium: "50"
          sarif: "true"
          # Artefaktname "polyscan-reports" ist fest und schon vom SAST-Job belegt
          upload-artifacts: "false"

      # Image-Funde haben keinen Dateibezug, Code Scanning verlangt aber pro Fund eine Location.
      # Solche Funde dem Dockerfile zuordnen, das das Basis-Image festlegt.
      - name: SARIF für Code Scanning aufbereiten
        if: always() && hashFiles('polyscan.sarif') != ''
        shell: python
        run: |
          import json
          fallback = {"physicalLocation": {"artifactLocation": {"uri": "Dockerfile"}, "region": {"startLine": 1}}}
          with open("polyscan.sarif", encoding="utf-8") as f:
              sarif = json.load(f)
          fixed = 0
          for run in sarif.get("runs", []):
              for result in run.get("results", []):
                  if not any(loc.get("physicalLocation") for loc in result.get("locations") or []):
                      result["locations"] = [fallback]
                      fixed += 1
          with open("polyscan.sarif", "w", encoding="utf-8") as f:
              json.dump(sarif, f)
          print(f"{fixed} Fund(e) dem Dockerfile zugeordnet")

      - name: SARIF nach Code Scanning
        if: always() && hashFiles('polyscan.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: polyscan.sarif
          category: polyscan-image

      - name: Login bei GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bauen und pushen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
